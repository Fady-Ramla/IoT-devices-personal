version: "1.0"
mode: "shadow_only"

model:
  artifact: "New_Datasets/models/run_level_144_packet_v3/random_forest.joblib"
  metrics: "New_Datasets/models/run_level_144_packet_v3/metrics.json"
  feature_count: 39
  feature_order_source: "metrics.json"

input:
  unit: "one independent run or fixed observation window"
  required_features:
    - observation_count
    - packet_length__mean
    - packet_length__std
    - packet_length__min
    - packet_length__max
    - packet_length__median
    - tcp_syn__mean
    - tcp_syn__std
    - tcp_syn__min
    - tcp_syn__max
    - tcp_syn__median
    - tcp_ack__mean
    - tcp_ack__std
    - tcp_ack__min
    - tcp_ack__max
    - tcp_ack__median
    - tcp_rst__mean
    - tcp_rst__std
    - tcp_rst__min
    - tcp_rst__max
    - tcp_rst__median
    - tcp_fin__mean
    - tcp_fin__std
    - tcp_fin__min
    - tcp_fin__max
    - tcp_fin__median
    - icmp_type__mean
    - icmp_type__std
    - icmp_type__min
    - icmp_type__max
    - icmp_type__median
    - arp_operation__mean
    - arp_operation__std
    - arp_operation__min
    - arp_operation__max
    - arp_operation__median
    - protocol__icmp__fraction
    - protocol__tcp__fraction
    - protocol__other__fraction

forbidden_model_inputs:
  - run_id
  - label
  - timestamp
  - src_ip
  - dst_ip
  - src_mac
  - dst_mac
  - filename
  - attack_type

output:
  required:
    - inference_id
    - observed_at
    - predicted_label
    - confidence
    - class_probabilities
    - model_version
    - feature_contract_version
    - mode
  mode_value: "shadow_only"

safety:
  network_actions_enabled: false
  blocking_enabled: false
  quarantine_enabled: false
  rerouting_enabled: false
  alert_only: true
  log_prediction_only: true

confidence:
  record_all_predictions: true
  low_confidence_logging: true
  no_automatic_action: true
